name: Debian 13

on:
  workflow_dispatch:
  pull_request:
    paths: ['windows/**', '.github/workflows/debian.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - name: Install Debian build dependencies
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential pkg-config libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-bin gnome-keyring dbus-x11 xdg-utils xvfb xauth desktop-file-utils
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend checks
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run build
      - name: Rust and Unix transport tests
        run: cargo test --workspace
      - name: Build amd64 package
        run: |
          test "$(dpkg --print-architecture)" = amd64
          npm run pack:debian
      - name: Package and launcher smoke check
        run: |
          apt-get install -y ./target/release/bundle/deb/*.deb
          desktop-file-validate /usr/share/applications/coucou.desktop
          test -x /usr/bin/coucou
          test -f /usr/lib/Coucou/coucou-hook || test -f /usr/lib/coucou/coucou-hook
          useradd -m -U coucou-smoke
          install -d -m 700 -o coucou-smoke -g coucou-smoke /tmp/coucou-runtime
          runuser -u coucou-smoke -- env XDG_RUNTIME_DIR=/tmp/coucou-runtime XDG_SESSION_TYPE=x11 xvfb-run -a dbus-run-session -- bash -c '
            set -e
            coucou --show > /tmp/coucou-smoke.log 2>&1 & app_pid=$!
            trap "kill \$app_pid 2>/dev/null || true" EXIT
            sleep 5
            kill -0 "$app_pid"
            timeout 5s coucou --show
            kill -0 "$app_pid"
            kill "$app_pid"
            wait "$app_pid" || true
          '
          cat /tmp/coucou-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Debian13-amd64
          path: windows/target/release/bundle/deb/*.deb
          if-no-files-found: error
